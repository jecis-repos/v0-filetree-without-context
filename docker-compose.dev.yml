version: '3.8'

services:
  app:
    build:
      context: .
      target: deps
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=filetree_dev
      - POSTGRES_USER=filetree
      - POSTGRES_PASSWORD=filetree

  php-server:
    build:
      context: ./php-server
    ports:
      - "8080:80"
    volumes:
      - ./php-server:/var/www/html
      - ./data:/var/www/html/data
    environment:
      - PHP_ENV=development
