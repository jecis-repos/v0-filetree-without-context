name: Build and startup
on:
  push:
    branches: [latest]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes pnpm@9.15.9 install --frozen-lockfile
      - run: npx --yes pnpm@9.15.9 build
      - run: npx --yes pnpm@9.15.9 smoke
